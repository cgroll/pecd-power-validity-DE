stages:
  download_pecd_capacity_factors:
    cmd: uv run python pipeline/01_download_pecd_capacity_factors.py
    deps:
      - pipeline/01_download_pecd_capacity_factors.py
      - pkg/cds.py
    outs:
      - data/downloads/pecd/pecd_solar_tech60.zip:
          persist: true
      - data/downloads/pecd/pecd_solar_tech61.zip:
          persist: true
      - data/downloads/pecd/pecd_solar_tech62.zip:
          persist: true
      - data/downloads/pecd/pecd_solar_tech63.zip:
          persist: true
      - data/downloads/pecd/pecd_wind_onshore_tech30.zip:
          persist: true
      - data/downloads/pecd/pecd_wind_offshore_tech20.zip:
          persist: true

  process_pecd_capacity_factors:
    cmd: uv run python pipeline/02_process_pecd_capacity_factors.py
    deps:
      - pipeline/02_process_pecd_capacity_factors.py
      - pkg/pecd_io.py
      - data/downloads/pecd/pecd_solar_tech60.zip
      - data/downloads/pecd/pecd_solar_tech61.zip
      - data/downloads/pecd/pecd_solar_tech62.zip
      - data/downloads/pecd/pecd_solar_tech63.zip
      - data/downloads/pecd/pecd_wind_onshore_tech30.zip
      - data/downloads/pecd/pecd_wind_offshore_tech20.zip
    outs:
      - data/processed/pecd_solar_capacity_factors.parquet
      - data/processed/pecd_wind_onshore_capacity_factors.parquet
      - data/processed/pecd_wind_offshore_capacity_factors.parquet

  download_smard:
    cmd: uv run python pipeline/03_download_smard.py
    deps:
      - pipeline/03_download_smard.py
      - pkg/smard.py
    outs:
      - data/downloads/smard/pv.parquet:
          persist: true
      - data/downloads/smard/wind_onshore.parquet:
          persist: true
      - data/downloads/smard/wind_offshore.parquet:
          persist: true
      - data/downloads/smard/load.parquet:
          persist: true
      - data/downloads/smard/price_de_lu.parquet:
          persist: true

  download_smard_capacities:
    cmd: uv run python pipeline/04_download_smard_capacities.py
    deps:
      - pipeline/04_download_smard_capacities.py
      - pkg/smard.py
    outs:
      - data/downloads/smard/capacity_solar.parquet:
          persist: true
      - data/downloads/smard/capacity_wind_onshore.parquet:
          persist: true
      - data/downloads/smard/capacity_wind_offshore.parquet:
          persist: true

  download_redispatch_by_source:
    cmd: uv run python pipeline/05_download_redispatch_by_source.py
    deps:
      - pipeline/05_download_redispatch_by_source.py
      - pkg/smard_redispatch.py
    outs:
      - data/downloads/smard/redispatch_by_source.parquet:
          persist: true

  download_redispatch_measures:
    cmd: uv run python pipeline/06_download_redispatch_measures.py
    deps:
      - pipeline/06_download_redispatch_measures.py
      - pkg/redispatch_measures.py
    outs:
      - data/downloads/netztransparenz/redispatch_measures.csv:
          persist: true

  fetch_external_capacity_panels:
    cmd: uv run python pipeline/07_fetch_external_capacity_panels.py
    deps:
      - pipeline/07_fetch_external_capacity_panels.py
    outs:
      - data/downloads/external/capacity_by_peon_month.parquet:
          persist: true
      - data/downloads/external/capacity_by_peof_month.parquet:
          persist: true
      - data/downloads/external/capacity_by_offshore_month.parquet:
          persist: true
      - data/downloads/external/capacity_by_nuts2_month.parquet:
          persist: true
      - data/downloads/external/solar_capacity_by_nuts2_month.parquet:
          persist: true

  download_pecd_masks:
    cmd: uv run python pipeline/08_download_pecd_masks.py
    deps:
      - pipeline/08_download_pecd_masks.py
    outs:
      - data/downloads/pecd/peon_region_mask.nc:
          persist: true
      - data/downloads/pecd/peof_region_mask.nc:
          persist: true

  download_region_geometries:
    cmd: uv run python pipeline/09_download_region_geometries.py
    deps:
      - pipeline/09_download_region_geometries.py
    outs:
      - data/downloads/nuts_regions.geojson:
          persist: true
      - data/downloads/country_borders.geojson:
          persist: true

  eda_data_availability:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/10_eda_data_availability.ipynb
      pipeline/10_eda_data_availability.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/10_eda_data_availability.ipynb
    deps:
      - pipeline/10_eda_data_availability.py
      - pkg/redispatch_measures.py
      - data/processed/pecd_solar_capacity_factors.parquet
      - data/processed/pecd_wind_onshore_capacity_factors.parquet
      - data/processed/pecd_wind_offshore_capacity_factors.parquet
      - data/downloads/smard/pv.parquet
      - data/downloads/smard/wind_onshore.parquet
      - data/downloads/smard/wind_offshore.parquet
      - data/downloads/smard/load.parquet
      - data/downloads/smard/price_de_lu.parquet
      - data/downloads/smard/capacity_solar.parquet
      - data/downloads/smard/capacity_wind_onshore.parquet
      - data/downloads/smard/capacity_wind_offshore.parquet
      - data/downloads/smard/redispatch_by_source.parquet
      - data/downloads/netztransparenz/redispatch_measures.csv
      - data/downloads/external/capacity_by_peon_month.parquet
      - data/downloads/external/capacity_by_peof_month.parquet
      - data/downloads/external/capacity_by_offshore_month.parquet
      - data/downloads/external/capacity_by_nuts2_month.parquet
      - data/downloads/external/solar_capacity_by_nuts2_month.parquet
    outs:
      - book/notebooks/10_eda_data_availability.ipynb:
          cache: false
      - output/images/10_data_availability_heatmap.png:
          cache: false

  eda_region_maps:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/11_eda_region_maps.ipynb
      pipeline/11_eda_region_maps.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/11_eda_region_maps.ipynb
    deps:
      - pipeline/11_eda_region_maps.py
      - data/downloads/nuts_regions.geojson
      - data/downloads/country_borders.geojson
      - data/downloads/pecd/peon_region_mask.nc
      - data/downloads/pecd/peof_region_mask.nc
    outs:
      - book/notebooks/11_eda_region_maps.ipynb:
          cache: false
      - output/images/11_nuts2_regions.png:
          cache: false
      - output/images/11_peon_zone_grid.png:
          cache: false
      - output/images/11_peof_zone_grid.png:
          cache: false

  eda_redispatch_comparison:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/12_eda_redispatch_comparison.ipynb
      pipeline/12_eda_redispatch_comparison.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/12_eda_redispatch_comparison.ipynb
    deps:
      - pipeline/12_eda_redispatch_comparison.py
      - pkg/redispatch_measures.py
      - data/downloads/smard/redispatch_by_source.parquet
      - data/downloads/netztransparenz/redispatch_measures.csv
    outs:
      - book/notebooks/12_eda_redispatch_comparison.ipynb:
          cache: false
      - output/images/12_redispatch_sources_side_by_side.png:
          cache: false

  eda_capacity_over_time:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/13_eda_capacity_over_time.ipynb
      pipeline/13_eda_capacity_over_time.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/13_eda_capacity_over_time.ipynb
    deps:
      - pipeline/13_eda_capacity_over_time.py
      - data/downloads/nuts_regions.geojson
      - data/downloads/country_borders.geojson
      - data/downloads/pecd/peon_region_mask.nc
      - data/downloads/pecd/peof_region_mask.nc
      - data/downloads/external/capacity_by_peon_month.parquet
      - data/downloads/external/capacity_by_peof_month.parquet
      - data/downloads/external/solar_capacity_by_nuts2_month.parquet
    outs:
      - book/notebooks/13_eda_capacity_over_time.ipynb:
          cache: false
      - output/images/13_national_capacity_over_time.png:
          cache: false
      - output/images/13_solar_capacity_choropleth.gif:
          cache: false
      - output/images/13_wind_onshore_capacity_choropleth.gif:
          cache: false
      - output/images/13_wind_offshore_capacity_choropleth.gif:
          cache: false

  build_pecd_potential_panel:
    cmd: uv run python pipeline/14_build_pecd_potential_panel.py
    deps:
      - pipeline/14_build_pecd_potential_panel.py
      - pkg/potential.py
      - data/processed/pecd_solar_capacity_factors.parquet
      - data/processed/pecd_wind_onshore_capacity_factors.parquet
      - data/processed/pecd_wind_offshore_capacity_factors.parquet
      - data/downloads/external/solar_capacity_by_nuts2_month.parquet
      - data/downloads/external/capacity_by_peon_month.parquet
      - data/downloads/external/capacity_by_peof_month.parquet
    outs:
      - data/processed/pecd_potential_panel.parquet

  build_target_panel:
    cmd: uv run python pipeline/15_build_target_panel.py
    deps:
      - pipeline/15_build_target_panel.py
      - data/downloads/smard/pv.parquet
      - data/downloads/smard/wind_onshore.parquet
      - data/downloads/smard/wind_offshore.parquet
      - data/downloads/smard/load.parquet
      - data/downloads/smard/price_de_lu.parquet
    outs:
      - data/processed/target_panel.parquet

  analyse_potential_vs_observed:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/16_analyse_potential_vs_observed.ipynb
      pipeline/16_analyse_potential_vs_observed.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/16_analyse_potential_vs_observed.ipynb
    deps:
      - pipeline/16_analyse_potential_vs_observed.py
      - pkg/potential.py
      - data/processed/pecd_potential_panel.parquet
      - data/processed/target_panel.parquet
      - data/processed/pecd_solar_capacity_factors.parquet
      - data/processed/pecd_wind_onshore_capacity_factors.parquet
      - data/processed/pecd_wind_offshore_capacity_factors.parquet
      - data/downloads/external/solar_capacity_by_nuts2_month.parquet
      - data/downloads/external/capacity_by_peon_month.parquet
      - data/downloads/external/capacity_by_peof_month.parquet
    outs:
      - book/notebooks/16_analyse_potential_vs_observed.ipynb:
          cache: false
      - output/images/16_potential_vs_observed_monthly.png:
          cache: false
      - output/images/16_potential_vs_observed_zoom.png:
          cache: false
      - output/images/16_potential_vs_observed_scatter.png:
          cache: false
      - output/images/16_potential_vs_observed_scatter_gw.png:
          cache: false

  analyse_curtailment_gap:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/17_analyse_curtailment_gap.ipynb
      pipeline/17_analyse_curtailment_gap.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/17_analyse_curtailment_gap.ipynb
    deps:
      - pipeline/17_analyse_curtailment_gap.py
      - pkg/potential.py
      - pkg/redispatch_measures.py
      - data/processed/pecd_potential_panel.parquet
      - data/processed/target_panel.parquet
      - data/downloads/smard/redispatch_by_source.parquet
      - data/downloads/netztransparenz/redispatch_measures.csv
      - data/processed/pecd_solar_capacity_factors.parquet
      - data/processed/pecd_wind_onshore_capacity_factors.parquet
      - data/processed/pecd_wind_offshore_capacity_factors.parquet
      - data/downloads/external/solar_capacity_by_nuts2_month.parquet
      - data/downloads/external/capacity_by_peon_month.parquet
      - data/downloads/external/capacity_by_peof_month.parquet
    outs:
      - book/notebooks/17_analyse_curtailment_gap.ipynb:
          cache: false
      - output/images/17_gap_vs_redispatch.png:
          cache: false
      - output/images/17_gap_by_price_sign.png:
          cache: false
      - output/images/17_offshore_hourly_adjusted.png:
          cache: false

  analyse_remaining_gap:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/18_analyse_remaining_gap.ipynb
      pipeline/18_analyse_remaining_gap.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/18_analyse_remaining_gap.ipynb
    deps:
      - pipeline/18_analyse_remaining_gap.py
      - data/processed/pecd_potential_panel.parquet
      - data/processed/target_panel.parquet
      - data/downloads/smard/redispatch_by_source.parquet
      - data/downloads/external/capacity_by_nuts2_month.parquet
    outs:
      - book/notebooks/18_analyse_remaining_gap.ipynb:
          cache: false
      - output/images/18_wind_residual_by_year.png:
          cache: false
      - output/images/18_solar_feed_in_category_share.png:
          cache: false
